<style>
:root {
  --fundo: #07080c;
  --fundo-2: #0d0f16;
  --vidro: rgb(20 23 33 / .72);
  --vidro-forte: rgb(16 18 26 / .94);
  --borda: rgb(255 255 255 / .09);
  --borda-forte: rgb(255 255 255 / .18);
  --texto: #eef0f6;
  --texto-2: #a3a8b8;
  --texto-3: #6b7185;
  --experiencia: #c084fc;
  --extensoes: #f4f4f5;
  --nucleo: #e2e8f0;
  --dados: #60a5fa;
  --admin: #8b8cff;
  --loja: #2dd4bf;
  --marketing: #fb7185;
  --integracao: #fbbf24;
  --externo: #a1a1aa;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(1200px 700px at 50% 38%, #141a2b 0%, var(--fundo) 62%) fixed, var(--fundo);
  color: var(--texto); font: 14px/1.5 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }

/* ---------- fundo vivo ---------- */
#estrelas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .55; }

/* ---------- topo ---------- */
.topo {
  position: fixed; inset: 16px 16px auto 16px; z-index: 20; display: flex; align-items: center; gap: 12px; pointer-events: none;
}
.topo > * { pointer-events: auto; }
.marca { display: flex; align-items: center; gap: 12px; }
.marca svg { width: 36px; height: 36px; flex: none; }
.marca h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.marca p { margin: 0; color: var(--texto-2); font-size: 12px; }
.acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.botao {
  height: 38px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--borda); background: var(--vidro);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500; transition: border-color .2s, background .2s;
}
.botao:hover { border-color: var(--borda-forte); }
.botao.primario { background: var(--texto); color: var(--fundo); border-color: transparent; font-weight: 600; }
.botao svg { width: 16px; height: 16px; }
.botao:focus-visible, .peca:focus-visible, .orbe:focus-visible, .chip-ir:focus-visible { outline: 2px solid var(--loja); outline-offset: 3px; }

.trilha { position: fixed; top: 70px; left: 16px; z-index: 20; display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--texto-2); }
.trilha button { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--texto-2); }
.trilha button:hover { color: var(--texto); }
.trilha b { color: var(--texto); font-weight: 600; }

/* ---------- números ---------- */
.numeros { position: fixed; left: 16px; bottom: 16px; z-index: 15; display: flex; gap: 8px; flex-wrap: wrap; max-width: min(760px, calc(100% - 32px)); }
.numero {
  background: var(--vidro); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--borda);
  border-radius: 13px; padding: 8px 13px; min-width: 86px;
}
.numero b { display: block; font-size: 21px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.numero span { font-size: 11.5px; color: var(--texto-2); }
.vivo {
  position: fixed; right: 16px; bottom: 16px; z-index: 15; width: 260px; background: var(--vidro); backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px); border: 1px solid var(--borda); border-radius: 13px; padding: 10px 13px;
}
.vivo-topo { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--texto-2); }
.vivo-topo b { color: var(--texto); font-weight: 600; }
.pulso { width: 8px; height: 8px; border-radius: 50%; background: var(--loja); box-shadow: 0 0 0 0 rgb(45 212 191 / .6); animation: pulso 2s infinite; }
@keyframes pulso { 70% { box-shadow: 0 0 0 8px rgb(45 212 191 / 0); } 100% { box-shadow: 0 0 0 0 rgb(45 212 191 / 0); } }
.vivo svg { display: block; width: 100%; height: 34px; margin-top: 8px; }
.vivo small { display: block; color: var(--texto-3); font-size: 11px; margin-top: 4px; }

.controle { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); z-index: 15; display: flex; flex-direction: column; gap: 8px; }
.controle .botao { width: 40px; padding: 0; justify-content: center; }
.explodir {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 15; display: flex; align-items: center; gap: 10px;
  background: var(--vidro); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--borda); border-radius: 999px;
  padding: 6px 14px; font-size: 12px; color: var(--texto-2);
}
.explodir input { width: 120px; accent-color: var(--loja); }

/* ---------- cena 3D ---------- */
.cena { position: fixed; inset: 0; perspective: 2400px; perspective-origin: 50% 42%; touch-action: none; cursor: grab; }
.cena.arrastando { cursor: grabbing; }
.mundo {
  position: absolute; left: 50%; top: 52%; width: 0; height: 0; transform-style: preserve-3d;
  transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(var(--zoom, 1)) rotateX(var(--rx, 58deg)) rotateZ(var(--rz, -38deg)) translateZ(var(--tz, 0px));
}
.mundo.voando { transition: transform 1.1s cubic-bezier(.2,.8,.2,1); }
.camada {
  position: absolute; left: -450px; top: -280px; width: 900px; height: 560px; border-radius: 30px; transform-style: preserve-3d;
  transform: translateZ(calc(var(--i) * var(--gap, 150px) - 1.5 * var(--gap, 150px)));
  transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .6s;
}
.placa {
  position: absolute; inset: 0; border-radius: 30px; cursor: pointer;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--cor) 14%, transparent), color-mix(in srgb, var(--cor) 3%, transparent) 60%),
    repeating-linear-gradient(0deg, rgb(255 255 255 / .025) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgb(255 255 255 / .025) 0 1px, transparent 1px 28px),
    rgb(12 14 22 / .78);
  border: 1px solid color-mix(in srgb, var(--cor) 45%, transparent);
  box-shadow: 0 0 0 1px rgb(0 0 0 / .4), 0 0 60px -10px color-mix(in srgb, var(--cor) 35%, transparent), inset 0 0 80px -30px color-mix(in srgb, var(--cor) 30%, transparent);
  transition: border-color .3s, box-shadow .3s;
}
.camada:hover .placa, .camada.focada .placa { border-color: color-mix(in srgb, var(--cor) 85%, transparent); }
.rotulo-camada { position: absolute; right: calc(100% + 36px); top: 26px; width: 300px; text-align: right; pointer-events: none; }
.rotulo-camada p { margin-left: auto; }
.rotulo-camada .n { font: 500 12px var(--mono); color: var(--cor); letter-spacing: .12em; }
.rotulo-camada h2 { margin: 2px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
.rotulo-camada p { margin: 6px 0 0; color: var(--texto-2); font-size: 13px; max-width: 330px; }
.camada.longe { opacity: .07; pointer-events: none; }
.camada.longe .feixe, .camada.longe .fluxo { display: none; }

.peca {
  position: absolute; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--cor) 50%, transparent);
  background: linear-gradient(160deg, color-mix(in srgb, var(--cor) 22%, rgb(20 23 34)), rgb(14 16 24));
  box-shadow: 0 10px 30px -12px rgb(0 0 0 / .8), 0 0 24px -8px color-mix(in srgb, var(--cor) 50%, transparent);
  padding: 12px 14px; cursor: pointer; transform: translateZ(3px); transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .3s, opacity .3s;
  text-align: left; color: var(--texto); transform-style: preserve-3d;
}
.peca:hover, .peca.ativa { transform: translateZ(26px); box-shadow: 0 30px 40px -18px rgb(0 0 0 / .9), 0 0 36px -4px color-mix(in srgb, var(--cor) 70%, transparent); }
.peca b { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.peca small { display: block; color: var(--texto-2); font-size: 11.5px; margin-top: 3px; }
.peca .marca-cor { position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--cor); }
.peca.apagada { opacity: .25; }
.peca-grande { padding: 18px 20px; }
.peca-grande b { font-size: 18px; }
.peca-grande .valor { font-size: 34px; font-weight: 800; letter-spacing: -.04em; line-height: 1; margin-top: 10px; display: block; }
.ficha-tabela {
  position: absolute; height: 19px; border-radius: 6px; padding: 0 7px; font: 500 10.5px/19px var(--mono); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; color: color-mix(in srgb, var(--cor) 80%, white); background: color-mix(in srgb, var(--cor) 14%, rgb(10 12 20));
  border: 1px solid color-mix(in srgb, var(--cor) 35%, transparent); transform: translateZ(2px);
}
.gatilho-marca { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fde047; box-shadow: 0 0 12px 3px rgb(253 224 71 / .55); transform: translateZ(4px); animation: piscar 2.4s ease-in-out infinite; }
@keyframes piscar { 50% { opacity: .35; } }

/* feixes verticais entre camadas */
.feixe {
  position: absolute; width: 2px; transform-origin: 50% 0; pointer-events: none;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--cor) 0%, transparent), color-mix(in srgb, var(--cor) 55%, transparent));
}
.feixe.desce { transform: translateZ(0) rotateX(-90deg); }
.feixe.sobe { transform: translateZ(0) rotateX(90deg); }
.feixe i {
  position: absolute; left: -2px; width: 6px; height: 22px; border-radius: 3px; top: 0;
  background: linear-gradient(to bottom, transparent, var(--cor)); box-shadow: 0 0 12px 2px var(--cor);
  animation: correr var(--dur, 2.4s) linear infinite; animation-delay: var(--atraso, 0s);
}
@keyframes correr { from { transform: translateY(-22px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateY(var(--h)); opacity: 0; } }

.fluxo { position: absolute; left: -220px; top: -200px; overflow: visible; pointer-events: none; transform: translateZ(1px); }
.fluxo path { fill: none; stroke-width: 1.6; }
.fluxo .ligacao { stroke: rgb(255 255 255 / .22); stroke-dasharray: 4 6; }
.fluxo .externa { stroke: rgb(161 161 170 / .28); stroke-dasharray: 2 6; }
.fluxo .acesa { stroke: var(--loja); stroke-opacity: .9; stroke-dasharray: none; }
.orbe {
  position: absolute; width: 132px; margin-left: -66px; margin-top: -26px; height: 52px; border-radius: 999px; cursor: pointer;
  border: 1px solid rgb(255 255 255 / .16); background: rgb(24 26 36 / .9); display: flex; align-items: center; gap: 9px; padding: 0 14px;
  transform: translateZ(10px); transition: transform .3s; color: var(--texto); text-align: left;
}
.orbe:hover, .orbe.ativa { transform: translateZ(30px); border-color: var(--externo); }
.orbe .bola { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--externo); box-shadow: 0 0 14px 2px rgb(161 161 170 / .6); }
.orbe b { display: block; font-size: 12.5px; line-height: 1.15; }
.orbe small { display: block; font-size: 10.5px; color: var(--texto-2); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 86px; }

/* ---------- gaveta ---------- */
.gaveta {
  position: fixed; top: 16px; right: 16px; bottom: 16px; width: min(460px, calc(100% - 32px)); z-index: 30; display: flex; flex-direction: column;
  background: var(--vidro-forte); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid var(--borda); border-radius: 22px;
  box-shadow: 0 30px 80px -20px rgb(0 0 0 / .8); transform: translateX(calc(100% + 32px)); transition: transform .45s cubic-bezier(.2,.8,.2,1);
}
.gaveta.aberta { transform: none; }
.gaveta-topo { padding: 22px 22px 14px; border-bottom: 1px solid var(--borda); }
.gaveta-topo .tipo { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--cor); }
.gaveta-topo h3 { margin: 4px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }
.gaveta-topo p { margin: 8px 0 0; color: var(--texto-2); }
.fechar { position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--borda); background: none; cursor: pointer; }
.gaveta-corpo { flex: 1; overflow: auto; padding: 18px 22px 26px; }
.gaveta-corpo h4 { margin: 22px 0 9px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--texto-3); }
.gaveta-corpo h4:first-child { margin-top: 0; }
.metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.metrica { border: 1px solid var(--borda); border-radius: 13px; padding: 10px 12px; background: rgb(255 255 255 / .02); }
.metrica b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.metrica span { font-size: 11.5px; color: var(--texto-2); }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lista li { border: 1px solid var(--borda); border-radius: 12px; padding: 9px 12px; display: flex; gap: 10px; align-items: baseline; background: rgb(255 255 255 / .02); }
.lista li > div { flex: 1; min-width: 0; }
.lista .t { font-weight: 600; }
.lista .s { color: var(--texto-2); font-size: 12.5px; }
.contagem { font: 500 12px var(--mono); color: var(--loja); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--borda); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; background: rgb(255 255 255 / .03); }
.chip .bola { width: 7px; height: 7px; border-radius: 50%; }
.chip.mono { font-family: var(--mono); font-size: 11.5px; }
button.chip-ir { cursor: pointer; }
button.chip-ir:hover { border-color: var(--borda-forte); }
.codigo { border: 1px solid var(--borda); border-radius: 14px; overflow: hidden; background: #0a0c12; }
.codigo-topo { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--borda); font: 11.5px var(--mono); color: var(--texto-3); }
.codigo-topo i { width: 9px; height: 9px; border-radius: 50%; background: #2a2e3b; }
.codigo-topo span { margin-left: 6px; }
.codigo pre { margin: 0; padding: 13px 14px 15px; font: 12px/1.65 var(--mono); overflow-x: auto; color: #cdd3e1; min-height: 60px; white-space: pre; }
.codigo .cursor { display: inline-block; width: 7px; height: 14px; background: var(--loja); vertical-align: -2px; animation: piscar 1s steps(1) infinite; }
.k { color: #c792ea; } .s2 { color: #a5e075; } .n { color: #f78c6c; } .c { color: #5c6680; font-style: italic; } .f { color: #82aaff; } .t2 { color: #ffcb6b; }
.linha-tempo { display: flex; gap: 14px; flex-wrap: wrap; color: var(--texto-2); font-size: 12.5px; }
.linha-tempo b { color: var(--texto); }
.vazio { color: var(--texto-3); font-size: 13px; }

/* ---------- apresentação ---------- */
.legenda {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); z-index: 25; width: min(760px, calc(100% - 32px));
  text-align: center; opacity: 0; transition: opacity .5s, transform .5s; pointer-events: none;
}
.legenda.visivel { opacity: 1; transform: translateX(-50%); }
.legenda .passo { font: 500 12px var(--mono); color: var(--loja); letter-spacing: .14em; }
.legenda h2 { margin: 8px 0 0; font-size: clamp(26px, 4.2vw, 46px); font-weight: 800; letter-spacing: -.045em; line-height: 1.05; text-wrap: balance; text-shadow: 0 4px 30px rgb(0 0 0 / .8); }
.legenda p { margin: 12px auto 0; max-width: 600px; color: var(--texto-2); font-size: clamp(14px, 1.6vw, 17px); text-wrap: pretty; text-shadow: 0 2px 16px rgb(0 0 0 / .9); }
.barra-tour {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 26; display: none; align-items: center; gap: 10px;
  background: var(--vidro); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--borda); border-radius: 999px; padding: 6px;
}
.apresentando .barra-tour { display: flex; }
.apresentando .numeros, .apresentando .vivo, .apresentando .explodir, .apresentando .controle, .apresentando .trilha { opacity: 0; pointer-events: none; }
.numeros, .vivo, .explodir, .controle, .trilha { transition: opacity .4s; }
.pontos-tour { display: flex; gap: 5px; padding: 0 4px; }
.pontos-tour i { width: 7px; height: 7px; border-radius: 50%; background: rgb(255 255 255 / .2); transition: background .3s, width .3s; }
.pontos-tour i.atual { background: var(--loja); width: 20px; border-radius: 4px; }
.barra-tour .botao { height: 34px; border-radius: 999px; }

@media (min-width: 761px) { .com-gaveta .legenda { left: calc((100% - 490px) / 2); width: min(700px, calc(100% - 530px)); } }
@media (max-width: 760px) {
  .marca p, .vivo, .controle, .explodir { display: none; }
  .marca { min-width: 0; }
  .marca h1 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .marca > div { min-width: 0; }
  .acoes .botao span { display: none; }
  .acoes .botao.primario span { display: inline; }
  .numeros { gap: 6px; }
  .numero { min-width: 0; padding: 6px 10px; }
  .numero b { font-size: 17px; }
  .gaveta { top: auto; left: 10px; right: 10px; bottom: 10px; width: auto; height: 68vh; transform: translateY(calc(100% + 20px)); }
  .legenda { bottom: 70px; }
  .trilha { top: 62px; }
}
.ponto-fluxo { filter: var(--brilho); }
.vivo .barra { fill: rgb(255 255 255 / .28); }
.vivo .barra.atual { fill: var(--loja); }
.botao-visual svg { width: 16px; height: 16px; }

/* ================================================================ mapa mental */
.modo-mapa .cena, .modo-mapa .controle, .modo-mapa .explodir, .modo-mapa .trilha { display: none; }
.mapa-mental { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; z-index: 5; }
.mapa-mental.arrastando { cursor: grabbing; }
.mm-mundo { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.mm-linhas { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
.mm-linhas path { fill: none; stroke: var(--cor); stroke-width: 2; stroke-opacity: .55; stroke-linecap: round; }
.mm-linhas path.raso { stroke-width: 3.2; stroke-opacity: .7; }
.mm-no { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 4px; will-change: transform, opacity; }
.mm-no.lado-esq { flex-direction: row-reverse; }
.mm-rotulo {
  display: flex; align-items: center; gap: 8px; height: 100%; width: 100%; padding: 0 12px; border-radius: 11px; cursor: pointer; text-align: left;
  border: 1px solid color-mix(in srgb, var(--cor) 45%, transparent); background: var(--vidro-forte); color: var(--texto);
  box-shadow: 0 6px 18px -10px rgb(0 0 0 / .6); transition: border-color .2s, background .2s, box-shadow .2s;
}
.mm-no.lado-esq .mm-rotulo { flex-direction: row-reverse; text-align: right; }
.mm-rotulo:hover { border-color: var(--cor); }

function proximaExecucao(cron) {
  const [min, hora, dia, mes, sem] = cron.split(/\s+/);
  if (dia !== '*' || mes !== '*' || sem !== '*') return null;
  const agora = new Date(), d = new Date(agora); d.setSeconds(0, 0);
  for (let i = 1; i <= 60 * 24 + 1; i++) {

    const ok = (campo, v) => campo === '*' || (campo.startsWith('*/') ? v % Number(campo.slice(2)) === 0 : campo.split(',').map(Number).includes(v));
    if (ok(min, d.getMinutes()) && ok(hora, d.getHours())) return d;
  }
  return null;
}
function destacar(codigo, lingua) {
  let h = esc(codigo);
  const marcas = [];
  // Marcador = um caractere de uso privado por trecho já colorido: não tem dígitos nem letras para os próximos passos pegarem.
  const guarda = (cls) => (m) => { marcas.push(`<span class="${cls}">${m}</span>`); return String.fromCharCode(0xE000 + marcas.length - 1); };
  h = h.replace(/(\/\/[^\n]*|--[^\n]*|#[^\n]*)/g, (m) => (lingua === 'graphql' && m.startsWith('#')) || m.startsWith('//') || (lingua === 'sql' && m.startsWith('--')) ? guarda('c')(m) : m);
  h = h.replace(/(&#39;[^\n]*?&#39;|&quot;[^\n]*?&quot;|`[^`]*`)/g, guarda('s2'));
  const kw = lingua === 'sql'
    ? /\b(CREATE|TABLE|IF|NOT|EXISTS|PRIMARY|KEY|REFERENCES|ON|DELETE|CASCADE|DEFAULT|NULL|UNIQUE|TRIGGER|BEFORE|AFTER|INSERT|UPDATE|OR|FOR|EACH|ROW|EXECUTE|FUNCTION|PROCEDURE|GENERATED|ALWAYS|AS|IDENTITY|INTEGER|SERIAL|TEXT|BOOLEAN|VARCHAR|NUMERIC|TIMESTAMPTZ|BIGINT|SMALLINT|JSONB|UUID|true|false)\b/g
    : lingua === 'graphql' ? /\b(type|extend|input|enum|query|mutation|String|Int|Float|Boolean|ID)\b/g
    : /\b(const|let|var|function|async|await|return|if|else|export|import|from|default|new|true|false|null|undefined|this)\b/g;
  h = h.replace(kw, guarda('k'));

  return voltar(h);
}
function digitar(pre, codigo, lingua) {

  let n = 0;

    n = Math.min(codigo.length, n + passo);
    pre.innerHTML = destacar(codigo.slice(0, n), lingua) + (n < codigo.length ? '<span class="cursor"></span>' : '');
    if (n >= codigo.length) clearInterval(digitando);
  }, 22);
}

function abrirModulo(id) {

    ${m.trecho ? `<h4>Código real</h4><div class="codigo"><div class="codigo-topo"><i></i><i></i><i></i><span>${esc(m.id)}/${esc(m.trecho.arquivo)}</span></div><pre id="pre-codigo"></pre></div>` : ''}
    ${m.rotinas.length ? `<h4>Rotinas rodando agora</h4><ul class="lista">${m.rotinas.map((r, k) => `<li><div><div class="t">${esc(r.quando)}</div><div class="s mono">${esc(r.nome)} · ${esc(r.agenda)}</div></div><span class="contagem" data-rotina="${k}">…</span></li>`).join('')}</ul>` : ''}
    ${m.gatilhos.length ? `<h4>Gatilhos no banco</h4><ul class="lista">${m.gatilhos.map((g) => `<li><div><div class="t">${g.momento === 'antes' ? 'Antes' : 'Depois'} de ${esc(g.quando)}</div><div class="s mono">${esc(g.tabela)}</div></div></li>`).join('')}</ul>` : ''}
    ${m.tabelas.length + m.visoes.length + m.colunas.length ? `<h4>Dados</h4><div class="chips">${[...m.tabelas, ...m.visoes, ...m.colunas].map((t) => `<span class="chip mono">${esc(t)}</span>`).join('')}</div>` : ''}
    ${m.telas.length ? `<h4>Telas</h4><div class="chips">${m.telas.map((t) => `<span class="chip">${esc(t.nome)} <small style="color:var(--texto-3)">${t.onde}</small></span>`).join('')}</div>` : ''}
    ${saem.length ? `<h4>Usa</h4><div class="chips">${saem.map((l) => chipModulo(l.para)).join('')}</div>` : ''}
    ${chegam.length ? `<h4>É usado por</h4><div class="chips">${chegam.map((l) => chipModulo(l.de)).join('')}</div>` : ''}
    ${m.externos.length ? `<h4>Fala com</h4><div class="chips">${m.externos.map(chipExterno).join('')}</div>` : ''}`;
  abrirGaveta(COR[m.grupo], `Módulo · ${NOME_GRUPO[m.grupo] || 'Loja'}`, m.nome, m.descricao, corpo);
  acender(id);
  const pre = $('#pre-codigo'); if (pre && m.trecho) digitar(pre, m.trecho.codigo, m.trecho.lingua);
  if (m.rotinas.length) {

    });
    tic(); relogio = setInterval(tic, 1000);
  }
}

// Árvore montada dos mesmos dados; cada ramo abre e recolhe com animação. Lado direito:
// Experiência, Módulos e Integrações; esquerdo: Núcleo e Dados.
const mm = (() => {
  const no = (id, nome, opc = {}) => ({ id, nome, filhos: [], ...opc });
  const raiz = no('raiz', D.projeto, { sub: D.subtitulo, cor: 'var(--loja)', aberto: true });

  const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

  const mod = add(raiz, no('mod', 'Módulos', { sub: `${modulos.length} módulos plugados no núcleo`, cor: 'var(--extensoes)', lado: 1, acao: () => abrirCamada('extensoes') }));
  const nuc = add(raiz, no('nuc', 'Núcleo', { sub: 'motor próprio', cor: 'var(--nucleo)', lado: -1, acao: () => abrirCamada('nucleo') }));
  const dad = add(raiz, no('dad', 'Dados', { sub: `${T.tabelas} tabelas · ${T.gatilhos} gatilhos`, cor: 'var(--dados)', lado: -1, acao: () => abrirCamada('dados') }));
  const ext = add(raiz, no('ext', 'Integrações', { sub: `${externos.length} serviços externos`, cor: 'var(--externo)', lado: 1 }));

  // Experiência: superfícies → telas
  for (const z of zonasExperiencia) {
    const zn = add(exp, no('z:' + z.nome, z.nome, { sub: `${z.valor} ${z.rotulo}`, acao: () => abrirZona(z) }));
    if (z.nome === 'Loja' || z.nome === 'Painel') {
      const onde = z.nome === 'Loja' ? 'loja' : 'painel';
      for (const m of modulos) {
        const telas = m.telas.filter((t) => t.onde === onde);
        if (!telas.length) continue;
        const mn = add(zn, no(`z:${onde}:${m.id}`, m.nome, { sub: plural(telas.length, 'tela', 'telas'), cor: COR[m.grupo] }));
        for (const t of telas) add(mn, no(`z:${onde}:${m.id}:${t.nome}`, t.nome));
      }
    } else if (z.nome === 'APIs') {
      for (const m of modulos.filter((x) => x.apis)) add(zn, no('z:api:' + m.id, m.nome, { sub: plural(m.apis, 'rota', 'rotas'), cor: COR[m.grupo] }));
    }
  }
  // Módulos: grupos → módulo → anatomia
  for (const g of grupos) {
    const ms = modulos.filter((m) => m.grupo === g);
    if (!ms.length) continue;
    const gn = add(mod, no('g:' + g, NOME_GRUPO[g], { sub: plural(ms.length, 'módulo', 'módulos'), cor: COR[g] }));
    for (const m of ms) {
      const mn = add(gn, no('m:' + m.id, m.nome, { sub: resumoModulo(m), acao: () => abrirModulo(m.id) }));
      const ramo = (id, nome, itens, opc = {}) => {
        if (!itens.length) return;
        const r = add(mn, no(`m:${m.id}:${id}`, nome, { sub: String(itens.length) }));
        for (const it of itens) add(r, no(`m:${m.id}:${id}:${it.chave ?? it}`, it.nome ?? it, { mono: opc.mono, acao: it.acao }));
      };
      ramo('telas', 'Telas', m.telas.map((t) => ({ nome: `${t.nome} · ${t.onde}`, chave: t.onde + t.nome })));
      ramo('dados', 'Tabelas', [...m.tabelas, ...m.visoes, ...m.colunas], { mono: true });
      ramo('gat', 'Gatilhos', m.gatilhos.map((x, k) => ({ nome: `${x.momento === 'antes' ? 'Antes' : 'Depois'} de ${x.quando} em ${x.tabela}`, chave: k })));
      ramo('rot', 'Rotinas', m.rotinas.map((r) => ({ nome: `${r.nome} · ${r.quando}`, chave: r.nome })));
      ramo('usa', 'Usa', D.ligacoes.filter((l) => l.de === m.id).map((l) => ({ nome: porId[l.para]?.nome ?? l.para, chave: l.para, acao: () => abrirModulo(l.para) })));
      ramo('fala', 'Fala com', m.externos.map((x) => ({ nome: externos.find((e) => e.id === x)?.nome ?? x, chave: x, acao: () => abrirExterno(x) })));
    }
  }
  // Núcleo: conceitos
  for (const n of nucleoInfo) add(nuc, no('n:' + n.id, n.nome, { sub: `${n.valor} ${n.rotulo}`, acao: () => abrirNucleo(n.id) }));
  // Dados: tabelas por módulo + núcleo
  for (const m of modulos) {
    const itens = [...m.tabelas, ...m.visoes];
    if (!itens.length && !m.gatilhos.length) continue;
    const mn = add(dad, no('d:' + m.id, m.nome, { sub: [itens.length && plural(itens.length, 'tabela', 'tabelas'), m.gatilhos.length && plural(m.gatilhos.length, 'gatilho', 'gatilhos')].filter(Boolean).join(' · '), cor: COR[m.grupo] }));
    for (const t of itens) add(mn, no(`d:${m.id}:${t}`, t, { mono: true }));
    for (const [k, x] of m.gatilhos.entries()) add(mn, no(`d:${m.id}:g${k}`, `⚡ ${x.momento} de ${x.quando} em ${x.tabela}`));
  }
  if (D.tabelasNucleo.length) {
    const tn = add(dad, no('d:nucleo', 'Tabelas do núcleo ampliadas', { sub: String(D.tabelasNucleo.length), cor: 'var(--nucleo)' }));
    for (const t of D.tabelasNucleo) add(tn, no('d:nucleo:' + t.tabela, t.tabela, { mono: true, sub: t.por.map((p) => porId[p]?.nome ?? p).join(', ') }));
  }
  // Integrações: serviço → módulos
  for (const x of externos) {
    const xn = add(ext, no('x:' + x.id, x.nome, { sub: x.papel, acao: () => abrirExterno(x.id) }));
    for (const u of x.usadoPor) add(xn, no(`x:${x.id}:${u}`, porId[u]?.nome ?? u, { cor: COR[porId[u]?.grupo], acao: () => abrirModulo(u) }));
  }

  // ------------------------------------------------ medidas
  const regua = document.createElement('canvas').getContext('2d');
  const largura = (t, fonte) => { regua.font = fonte; return regua.measureText(t).width; };
  const todos = [];
  function medir() { andar(raiz, 0); }
  function andar(n, nivel) {
    n.nivel = nivel;
    n.lado = n.lado ?? n.pai?.lado ?? 0;
    const fonte = nivel === 0 ? '800 18px Inter, sans-serif' : nivel === 1 ? '700 15px Inter, sans-serif' : n.mono ? '400 11.5px "JetBrains Mono", monospace' : `${n.filhos.length ? 600 : 500} 13px Inter, sans-serif`;
    const tw = Math.max(largura(n.nome, fonte), n.sub ? largura(n.sub, '400 11px Inter, sans-serif') : 0);
    n.w = Math.min(nivel === 0 ? 320 : n.filhos.length ? 290 : 400, Math.ceil(tw) + 46 + (n.filhos.length ? 34 : 0));
    n.h = nivel === 0 ? 62 : nivel === 1 ? 50 : n.sub ? 42 : 30;
    n.filhos.forEach((f) => andar(f, nivel + 1));
  }
  medir();
  (function juntar(n) { todos.push(n); n.filhos.forEach(juntar); })(raiz);
  const porNo = new Map(todos.map((n) => [n.id, n]));
  for (const n of todos) if (n.nivel === 1) n.aberto = true;

  // ------------------------------------------------ layout
  const GAP = 10, PASSO_X = 60;
  function altura(n) {
    if (!n.aberto || !n.filhos.length) return n.h;
    const soma = n.filhos.reduce((s, f) => s + altura(f), 0) + GAP * (n.filhos.length - 1);
    return Math.max(n.h, soma);
  }
  function posicionar() {
    for (const n of todos) n.visivel = false;
    raiz.x = 0; raiz.y = 0; raiz.visivel = true;
    for (const lado of [1, -1]) {
      const ramos = raiz.filhos.filter((f) => f.lado === lado);
      const total = ramos.reduce((s, f) => s + altura(f), 0) + GAP * 3 * (ramos.length - 1);
      let y = -total / 2;
      for (const f of ramos) {
        const a = altura(f);
        colocar(f, raiz, y + a / 2);
        y += a + GAP * 3;
      }
    }
  }
  function colocar(n, pai, y) {
    n.visivel = true; n.y = y;
    n.x = pai.x + n.lado * (pai.w / 2 + PASSO_X + n.w / 2);
    if (!n.aberto) return;
    let topo = y - altura(n) / 2;
    if (n.h > n.filhos.reduce((s, f) => s + altura(f), 0) + GAP * (n.filhos.length - 1)) topo = y - (n.filhos.reduce((s, f) => s + altura(f), 0) + GAP * (n.filhos.length - 1)) / 2;
    for (const f of n.filhos) { const a = altura(f); colocar(f, n, topo + a / 2); topo += a + GAP; }
  }
  const visivelPai = (n) => { let p = n.pai; while (p && !p.visivel) p = p.pai; return p || raiz; };

  // ------------------------------------------------ desenho
  const caixa = $('#mapa-mental'), mundoMM = $('#mm-mundo'), linhas = $('#mm-linhas'), camada = $('#mm-nos');
  const els = new Map(); // id → { el, x, y, op }
  const vista = { x: 0, y: 0, k: 1 };
  const aplicarVista = () => { mundoMM.style.transform = `translate(${vista.x}px, ${vista.y}px) scale(${vista.k})`; };

  function criarEl(n) {
    const el = document.createElement('div');
    el.className = `mm-no nivel-${Math.min(n.nivel, 2)}${n.lado < 0 ? ' lado-esq' : ''}${n.filhos.length ? '' : ' folha'}${n.mono ? ' mono' : ''}`;
    el.style.setProperty('--cor', n.cor);
    el.style.width = n.w + (n.acao && n.filhos.length ? 28 : 0) + 'px'; el.style.height = n.h + 'px';
    const b = document.createElement('button');
    b.className = 'mm-rotulo'; b.type = 'button';
    b.setAttribute('role', 'treeitem');
    b.innerHTML = `${n.nivel > 0 ? '<span class="ponta"></span>' : ''}<span class="txt"><b>${esc(n.nome)}</b>${n.sub ? `<small>${esc(n.sub)}</small>` : ''}</span>${n.filhos.length ? '<span class="qtd"></span>' : ''}`;
    b.title = n.nome + (n.sub ? ' · ' + n.sub : '');
    b.addEventListener('click', (ev) => {
      ev.stopPropagation(); if (moveuMM) return;
      if (n.filhos.length) alternar(n); else if (n.acao) n.acao();
    });
    b.addEventListener('dblclick', (ev) => { ev.stopPropagation(); n.acao?.(); });
    el.appendChild(b);
    if (n.acao && n.filhos.length) {
      const i = document.createElement('button');
      i.className = 'mm-info'; i.type = 'button'; i.textContent = 'i';
      i.setAttribute('aria-label', 'Detalhes de ' + n.nome); i.title = 'Detalhes';
      i.addEventListener('click', (ev) => { ev.stopPropagation(); if (!moveuMM) n.acao(); });
      el.appendChild(i);
    }
    camada.appendChild(el);
    return el;
  }
  function atualizarEl(n, el) {
    el.classList.toggle('aberto', !!n.aberto);
    const b = el.firstChild;
    if (n.filhos.length) {
      b.setAttribute('aria-expanded', String(!!n.aberto));
      b.querySelector('.qtd').textContent = n.aberto ? '−' : n.filhos.length;
      b.setAttribute('aria-label', `${n.nome}${n.sub ? ', ' + n.sub : ''}. ${n.aberto ? 'Aberto' : `${n.filhos.length} itens recolhidos`}`);
    }
  }
  const largEl = (n) => n.w + (n.acao && n.filhos.length ? 28 : 0);
  function colocarEl(n, s) {
    const lx = n.lado < 0 ? s.x - largEl(n) + n.w / 2 : s.x - n.w / 2;
    s.el.style.transform = `translate(${lx}px, ${s.y - n.h / 2}px)`;
    s.el.style.opacity = s.op;
  }
  function caminho(p, ps, f, fs) {
    const lado = f.lado || 1;
    const x1 = ps.x + lado * p.w / 2, y1 = ps.y, x2 = fs.x - lado * f.w / 2, y2 = fs.y;
    const dx = (x2 - x1) * .5;
    return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
  }

  let animacao = null;
  function desenhar(foco, animar = true) {
    const antes = foco ? { x: foco.x, y: foco.y } : null;
    posicionar();
    // compensa a vista para o ramo clicado ficar no mesmo lugar da tela
    const alvoVista = { ...vista };
    if (foco && antes) { alvoVista.x -= (foco.x - antes.x) * vista.k; alvoVista.y -= (foco.y - antes.y) * vista.k; }
    const alvos = new Map();
    for (const n of todos) {
      let s = els.get(n.id);
      if (n.visivel) {
        if (!s) {
          const p = visivelPai(n.pai ? n : raiz), ps = els.get(p.id);
          s = { el: criarEl(n), x: ps ? ps.x : n.x, y: ps ? ps.y : n.y, op: 0 };
          els.set(n.id, s);
        }
        atualizarEl(n, s.el);
        alvos.set(n.id, { x: n.x, y: n.y, op: 1 });
      } else if (s) {
        const p = visivelPai(n);
        alvos.set(n.id, { x: p.x, y: p.y, op: 0, sair: true });
      }
    }
    const inicio = new Map([...els].map(([id, s]) => [id, { x: s.x, y: s.y, op: s.op }]));
    const v0 = { ...vista };
    cancelAnimationFrame(animacao);
    const t0 = performance.now(), dur = animar && !reduzir ? 420 : 0;
    const quadro = (t) => {
      const p = dur ? Math.min(1, (t - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 3);
      for (const [id, s] of els) {
        const a = alvos.get(id), i = inicio.get(id);
        if (!a) continue;
        s.x = i.x + (a.x - i.x) * e; s.y = i.y + (a.y - i.y) * e; s.op = i.op + (a.op - i.op) * e;
        colocarEl(porNo.get(id), s);
      }
      vista.x = v0.x + (alvoVista.x - v0.x) * e; vista.y = v0.y + (alvoVista.y - v0.y) * e; aplicarVista();
      // linhas: de cada nó presente ao pai presente
      const porCor = new Map();
      for (const [id, s] of els) {
        const n = porNo.get(id);
        if (!n.pai || s.op < .02) continue;
        const ps = els.get(n.pai.id); if (!ps) continue;
        const chave = n.cor + (n.nivel === 1 ? '|1' : '');
        porCor.set(chave, (porCor.get(chave) || '') + caminho(n.pai, ps, n, s));
      }
      linhas.innerHTML = [...porCor].map(([c, d]) => { const [cor, raso] = c.split('|'); return `<path class="${raso ? 'raso' : ''}" style="--cor:${cor}" d="${d}"/>`; }).join('');
      if (p < 1) animacao = requestAnimationFrame(quadro);
      else for (const [id, a] of alvos) if (a.sair) { els.get(id).el.remove(); els.delete(id); }
    };
    animacao = requestAnimationFrame(quadro);
  }

  function alternar(n) {
    n.aberto = !n.aberto;
    if (!n.aberto) (function fechar(x) { x.filhos.forEach((f) => { f.aberto = false; fechar(f); }); })(n);
    desenhar(n);
  }
  function encaixar(animar = true) {
    const vis = todos.filter((n) => n.visivel);
    const minX = Math.min(...vis.map((n) => n.x - largEl(n) / 2)) - 30, maxX = Math.max(...vis.map((n) => n.x + largEl(n) / 2)) + 30;
    const minY = Math.min(...vis.map((n) => n.y - n.h / 2)) - 30, maxY = Math.max(...vis.map((n) => n.y + n.h / 2)) + 30;
    const topo = 76, baixo = innerWidth < 760 ? 70 : 130, larg = innerWidth - (gaveta.classList.contains('aberta') && innerWidth >= 760 ? 490 : 0);
    const k = Math.max(.3, Math.min(1.15, larg / (maxX - minX), (innerHeight - topo - baixo) / (maxY - minY)));
    const alvo = { k, x: larg / 2 - ((minX + maxX) / 2) * k, y: topo + (innerHeight - topo - baixo) / 2 - ((minY + maxY) / 2) * k };
    if (!animar || reduzir) { Object.assign(vista, alvo); aplicarVista(); return; }
    const v0 = { ...vista }, t0 = performance.now();
    const passo = (t) => { const p = Math.min(1, (t - t0) / 500), e = 1 - Math.pow(1 - p, 3); vista.x = v0.x + (alvo.x - v0.x) * e; vista.y = v0.y + (alvo.y - v0.y) * e; vista.k = v0.k + (alvo.k - v0.k) * e; aplicarVista(); if (p < 1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  }

  // arrasto, zoom e pinça
  let arrastoMM = null, moveuMM = false;
  const toquesMM = new Map();
  caixa.addEventListener('pointerdown', (ev) => {
    toquesMM.set(ev.pointerId, { x: ev.clientX, y: ev.clientY }); moveuMM = false;
    if (toquesMM.size === 1) arrastoMM = { x: ev.clientX, y: ev.clientY, vx: vista.x, vy: vista.y };
    else if (toquesMM.size === 2) { const [a, b] = [...toquesMM.values()]; arrastoMM = { pinca: Math.hypot(a.x - b.x, a.y - b.y), k: vista.k, vx: vista.x, vy: vista.y, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 }; }
  });
  addEventListener('pointermove', (ev) => {
    if (!toquesMM.has(ev.pointerId) || !arrastoMM) return;
    toquesMM.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (arrastoMM.pinca && toquesMM.size === 2) {
      const [a, b] = [...toquesMM.values()];
      const k = Math.max(.2, Math.min(2.5, arrastoMM.k * Math.hypot(a.x - b.x, a.y - b.y) / arrastoMM.pinca));
      vista.k = k; vista.x = arrastoMM.cx - ((arrastoMM.cx - arrastoMM.vx) / arrastoMM.k) * k; vista.y = arrastoMM.cy - ((arrastoMM.cy - arrastoMM.vy) / arrastoMM.k) * k;
      moveuMM = true; aplicarVista(); return;
    }
    const dx = ev.clientX - arrastoMM.x, dy = ev.clientY - arrastoMM.y;
    if (!moveuMM && Math.hypot(dx, dy) < 5) return;
    moveuMM = true; caixa.classList.add('arrastando');
    vista.x = arrastoMM.vx + dx; vista.y = arrastoMM.vy + dy; aplicarVista();
  });
  const soltarMM = (ev) => { toquesMM.delete(ev.pointerId); if (!toquesMM.size) { arrastoMM = null; caixa.classList.remove('arrastando'); setTimeout(() => (moveuMM = false), 0); } };
  addEventListener('pointerup', soltarMM); addEventListener('pointercancel', soltarMM);
  caixa.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const k = Math.max(.2, Math.min(2.5, vista.k * Math.exp(-ev.deltaY * .0013)));
    vista.x = ev.clientX - ((ev.clientX - vista.x) / vista.k) * k; vista.y = ev.clientY - ((ev.clientY - vista.y) / vista.k) * k; vista.k = k; aplicarVista();
  }, { passive: false });

  $('#mm-expandir').onclick = () => { for (const n of todos) if (n.filhos.length) n.aberto = true; desenhar(null); setTimeout(() => encaixar(), 440); };
  $('#mm-recolher').onclick = () => { for (const n of todos) n.aberto = n.nivel === 0; desenhar(null); setTimeout(() => encaixar(), 440); };
  $('#mm-centro').onclick = () => encaixar();

  let montado = false;
  return {
    mostrar() {
      if (!montado) {
        montado = true;
        // mede de novo com a fonte certa (Inter) carregada, senão os rótulos saem cortados
        const iniciar = () => { medir(); posicionar(); encaixar(false); desenhar(null); };
        (document.fonts?.ready ?? Promise.resolve()).then(iniciar, iniciar);
      }
      else encaixar(false);
    },
    encaixar
  };
})();

// ---------------------------------------------------------------- modo (camadas 3D / mapa mental)
const ICONE_MAPA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.5"/><circle cx="4" cy="6" r="1.8"/><circle cx="4" cy="18" r="1.8"/><circle cx="20" cy="6" r="1.8"/><circle cx="20" cy="18" r="1.8"/><path d="M9.8 11 5.6 7.2M9.8 13l-4.2 3.8M14.2 11l4.2-3.8M14.2 13l4.2 3.8"/></svg>';
const ICONE_3D = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5"/></svg>';
function mostrarModo() {
  const mapa = modo === 'mapa';
  const b = $('#btn-modo');
  b.innerHTML = (mapa ? ICONE_3D : ICONE_MAPA) + `<span>${mapa ? 'Camadas 3D' : 'Mapa mental'}</span>`;
  b.setAttribute('aria-label', mapa ? 'Ver em camadas 3D' : 'Ver como mapa mental');
  document.body.classList.toggle('modo-mapa', mapa);
  $('#mapa-mental').hidden = !mapa; $('#mm-barra').hidden = !mapa;
}
function trocarModo(novo) {
  modo = novo || (modo === 'mapa' ? '3d' : 'mapa');
  try { localStorage.setItem('arquitetura-modo', modo); } catch (_) {}
  try { const u = new URL(location.href); if (modo === 'mapa') u.searchParams.set('modo', 'mapa'); else u.searchParams.delete('modo'); history.replaceState(null, '', u); } catch (_) {}
  fecharGaveta();
  mostrarModo();
  if (modo === 'mapa') { sairTour(); mm.mostrar(); } else visaoGeral(false);
}
$('#btn-modo').onclick = () => trocarModo();
addEventListener('keydown', (ev) => { if ((ev.key === 'm' || ev.key === 'M') && passo < 0 && !ev.ctrlKey && !ev.metaKey) trocarModo(); });
addEventListener('resize', () => { if (modo === 'mapa') mm.encaixar(false); });
(() => {
  const q = new URLSearchParams(location.search).get('modo');
  let inicial = q ? (/^mapa|mental/i.test(q) ? 'mapa' : '3d') : null;
  if (!inicial) { try { inicial = localStorage.getItem('arquitetura-modo'); } catch (_) {} }
  if (inicial === 'mapa') { modo = 'mapa'; mostrarModo(); requestAnimationFrame(() => mm.mostrar()); } else mostrarModo();
})();

// início: as camadas chegam de longe e se empilham
cam.zoom = encaixe();
if (!reduzir) {
  mundo.style.setProperty('--gap', '600px'); cam.rx = 70; cam.zoom = encaixe() * .7; aplicar(false);
  requestAnimationFrame(() => requestAnimationFrame(() => { mundo.style.setProperty('--gap', gap() + 'px'); cam.rx = 58; cam.zoom = encaixe(); aplicar(true); }));
} else aplicar(false);
trilha();
</script>
</body>
